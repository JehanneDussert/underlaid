name: Update pipeline data

# Quarterly by default: most sources (INSEE, IGN/IDF, Airparif/Bruitparif,
# Enedis, RNA...) don't change more often than that. DPE and Acceslibre
# are updated more frequently upstream and could be re-run on their own,
# faster schedule if that ever turns out to matter in practice — not done
# here because a full run only takes a few minutes, so splitting it adds
# workflow complexity (a second schedule, a partial-rerun path) for a
# benefit that hasn't been needed yet.
on:
  schedule:
    - cron: "0 3 1 1,4,7,10 *" # 03:00 UTC, the 1st of Jan/Apr/Jul/Oct
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write  # context-layer failures (see scripts/pipeline_policy.py)

env:
  # The 6 processed files the frontend actually fetches (see README's
  # "Build" section) — everything else in data/processed/ is either an
  # intermediate layer or context-only data with no frontend consumer.
  PUBLISHED_FILES: >-
    vulnerability_score_iris.geojson
    adaptive_capacity_iris.json
    key_figures.json
    routes_summary.json
    question_pairs.json
    map_iris.geojson
    qpv_boundaries_mgp.geojson
    associational_density_context_commune.geojson
    school_ac_context_arrondissement.geojson
    street_lighting_context_arrondissement.geojson
    tree_age_context_arrondissement.geojson
    last_updated.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pipeline image
        run: docker build -t underlaid-pipeline .

      - name: Run full pipeline
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/data:/app/data" \
            underlaid-pipeline python scripts/run_all.py

      # Failure policy (scripts/pipeline_policy.py): a failing context-only
      # layer (not scored) doesn't block the run — run_all.py keeps its
      # previous version (if valid and under two quarters old) and lists it
      # in data/processed/run_report.json. Make that visible as an issue,
      # one per script, commenting on it instead if one is already open.
      - name: Open an issue for context layers kept from a previous run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/context_failure_issues.py

      # Regression tests (tests/test_pipeline.py) are a broader guard
      # than the diff report alone — code_iris well-formedness, layer
      # row counts, the standing anti-regression check for the original
      # 47%/25% sparse-data bias, etc. A failure here means something is
      # structurally broken, not just distributionally different, so it
      # gates publishing exactly like the diff check does below.
      - name: Run regression tests against the fresh output
        id: tests
        continue-on-error: true
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/data:/app/data" \
            underlaid-pipeline python -m pytest tests/ -v

      # continue-on-error + checking steps.diff.outcome below (rather
      # than conclusion) is what lets a non-zero exit code here branch
      # the rest of the job instead of failing it outright — the diff
      # script's exit code IS the publish/don't-publish decision.
      - name: Compare against the currently published baseline
        id: diff
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/data:/app/data" \
            -v "${{ github.workspace }}/frontend/public/data:/app/published:ro" \
            underlaid-pipeline python scripts/23_diff_report.py \
              --baseline /app/published/vulnerability_score_iris.geojson \
              --new /app/data/processed/vulnerability_score_iris.geojson \
              --markdown-out /app/data/diff_report.md \
              --json-out /app/data/diff_report.json

      - name: Write a report explaining a test failure (skips the diff report)
        if: steps.tests.outcome == 'failure'
        run: |
          {
            echo "# Automated pipeline update — regression tests failed"
            echo
            echo "The freshly computed data failed \`pytest tests/\` before a distribution diff was even attempted. See the \"Run regression tests\" step's log in this workflow run for details."
          } > data/diff_report.md

      - name: Upload diff/failure report
        uses: actions/upload-artifact@v4
        with:
          name: diff-report
          path: data/diff_report.md

      # --- Path A: change is within the normal range -> publish directly ---

      - name: Snapshot and prune export history
        if: steps.tests.outcome == 'success' && steps.diff.outcome == 'success'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/data:/app/data" \
            underlaid-pipeline python scripts/prune_export_history.py --keep 4

      - name: Copy accepted update into the published data the frontend serves
        if: steps.diff.outcome == 'success'
        run: |
          for f in $PUBLISHED_FILES; do
            cp "data/processed/$f" "frontend/public/data/$f"
          done
          # Per-commune files of the neighbourhood page (script 39): a
          # directory, replaced whole so that no stale commune file remains.
          rm -rf frontend/public/data/quartiers
          cp -r data/processed/quartiers frontend/public/data/quartiers
          # Coordinate precision only (6 decimals, ~11 cm) — shapes are never
          # simplified: the address search relies on exact IRIS outlines. See
          # README, "Geometry: precision reduced, shapes not simplified".
          npx --yes mapshaper frontend/public/data/vulnerability_score_iris.geojson \
            -o precision=0.000001 force frontend/public/data/vulnerability_score_iris.geojson

      - name: Commit and push the accepted update
        if: steps.diff.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/history frontend/public/data
          if git diff --cached --quiet; then
            echo "No changes to publish (source data was identical to the last run)."
          else
            git commit -m "Automated pipeline update: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Trigger a redeploy
        if: steps.diff.outcome == 'success' && env.DEPLOY_HOOK_URL != ''
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"

      # --- Path B: tests failed, or the change is larger than the threshold -> stop and ask for a human ---
      #
      # Deliberately never auto-published, even though the underlying
      # data is already computed and sitting in data/processed/ at this
      # point: this project's own history has two real cases
      # (access_time, cool_facility_deficit — see SCORING.md) where a
      # distribution shift this size turned out to be a bug, not a real
      # change in the world, and both were only caught by a person
      # looking at the numbers. A quarterly unattended run has no one to
      # do that unless this step stops and asks.

      - name: Open a pull request for manual review (tests failed, or distribution shift exceeds threshold)
        if: steps.tests.outcome == 'failure' || steps.diff.outcome == 'failure'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Automated pipeline update — needs manual review before publishing"
          title: "Automated update: distribution shift exceeds the auto-publish threshold"
          body-path: data/diff_report.md
          branch: automated-update/needs-review
          add-paths: |
            data/processed
          labels: automated-update
