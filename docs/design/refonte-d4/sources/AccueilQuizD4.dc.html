<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil — sous la ligne de flottaison</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#101010}a:hover{color:#0057B8}
@keyframes mq-pulse{0%{r:5;opacity:.7}100%{r:14;opacity:0}}
@keyframes mq-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 1280px; box-sizing: border-box; background: #FFFFFF; color: #101010; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; padding: 56px 64px 40px; display: flex; flex-direction: column; gap: 56px">
<section aria-labelledby="mq-t" style="display: grid; grid-template-columns: 1fr 1.3fr; gap: 56px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: #E4007C"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5" fill="#E4007C" style="animation: mq-pulse 1600ms ease-out infinite"></circle><circle cx="10" cy="10" r="5" fill="#E4007C"></circle></svg>Une question au hasard</span>
<h2 id="mq-t" style="margin: 0; font-size: 32px; line-height: 1.15">Et vous, auriez-vous deviné ?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3C3C3C">Une question différente à chaque visite, tirée des chiffres du site.</p>
</div>
<div style="border: 2px solid #101010; border-radius: 22px; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.4">{{ q }}</p>
<div role="group" aria-label="Réponses" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.pressed }}" style="{{ o.style }}"><span>{{ o.label }}</span><span>{{ o.mark }}</span></button>
</sc-for>
</div>
<div style="{{ ansStyle }}">
<p style="margin: 0; font-size: 16px; line-height: 1.55">{{ expl }}</p>
<span style="font-size: 12px; color: #6A6A6A">{{ src }}</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<button type="button" onClick="{{ next }}" style="height: 42px; padding: 0 18px; border-radius: 999px; border: 2px solid #D6D6D6; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer">Une autre question</button>
<a href="#" style="font-size: 15px">Voir sur la carte →</a>
</div>
</div>
</section>
<footer style="padding-top: 24px; border-top: 1px solid #E6E6E6; display: flex; justify-content: space-between; gap: 24px; font-size: 14px; color: #3C3C3C"><span>Données publiques ouvertes. <a href="#">Sources et méthode</a></span><span style="display: flex; gap: 20px"><a href="#">Classement des communes</a><a href="#">Citer et réutiliser</a><a href="#">Presse</a><a href="#">Contact</a></span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280}}'>
const QS = [
  { q: 'À Paris, combien de minutes faut-il en médiane pour rejoindre à pied un arrêt de métro, de RER ou de tram accessible en fauteuil roulant ?', o: ['3 minutes', '7 minutes', '11 minutes'], a: 2,
    e: '11 minutes, contre 3 minutes pour rejoindre l’arrêt le plus proche, accessible ou non. À Paris, peu de stations de métro sont accessibles sans marches.', s: 'Médiane des quartiers parisiens. Données provisoires.' },
  { q: 'Où la part des points d’arrêt accessibles sans marches est-elle la plus élevée ?', o: ['Paris', 'Seine-Saint-Denis', 'C’est à peu près pareil'], a: 1,
    e: 'En Seine-Saint-Denis : [30 %] des points d’arrêt, contre [3,7 %] à Paris, où le métro, ancien, compte très peu de stations sans marches.', s: 'Données provisoires, définition à vérifier avant publication.' }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, pick: null }; }
  renderVals() {
    const st = this.state, Q = QS[st.i];
    const opts = Q.o.map((label, k) => {
      const answered = st.pick !== null, right = k === Q.a, chosen = k === st.pick;
      let style = 'display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 50px; padding: 0 18px; border-radius: 14px; font-family: inherit; font-size: 17px; text-align: left; cursor: pointer; color: #101010; ';
      if (!answered) style += 'border: 2px solid #D6D6D6; background: #FFFFFF;';
      else if (right) style += 'border: 2px solid #00A06B; background: #E3F5EC; font-weight: 700;';
      else if (chosen) style += 'border: 2px solid #E4007C; background: #FDE7F1;';
      else style += 'border: 2px solid #EEEEEE; background: #FFFFFF; color: #6A6A6A;';
      return { label: label, pressed: chosen ? 'true' : 'false', mark: answered ? (right ? '✓ bonne réponse' : (chosen ? 'votre réponse' : '')) : '', style: style, pick: () => { if (this.state.pick === null) this.setState({ pick: k }); } };
    });
    return {
      q: Q.q, opts: opts, expl: Q.e, src: Q.s,
      ansStyle: st.pick === null ? 'display: none;' : 'display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #EEEEEE; padding-top: 14px; animation: mq-in 300ms ease-out both;',
      next: () => this.setState({ i: (this.state.i + 1) % QS.length, pick: null })
    };
  }
}
</script>
</body>
</html>
